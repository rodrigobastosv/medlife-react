<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E7C86" />
    <meta name="description" content="MedLife — acompanhamento de pacientes e consultas." />

    <!--
      The theme is applied before React mounts. Without this the page paints in
      light mode for one frame and then flips, which reads as a flash of white
      on a dark-mode machine. It is inline (not a module) so it runs during
      parsing, ahead of any bundle download.
    -->
    <script>
      (() => {
        const stored = localStorage.getItem('medlife.themeMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark =
          stored === 'dark' || ((stored === null || stored === 'system') && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <title>MedLife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
