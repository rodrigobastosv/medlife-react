<!--
  The installable app icon, `purpose: "any"` — the launcher draws it as-is.

  It is not `logo.svg` with a bigger viewBox: the favicon is a bare glyph on the
  page's own background, while an app icon sits on a wallpaper and needs to
  carry its own. Hence the filled teal plate with the mark reversed out of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0E7C86" />
  <g transform="translate(81.92 81.92) scale(7.2533)">
    <path d="M24 4c8 6 14 12.5 14 21a14 14 0 1 1-28 0c0-8.5 6-15 14-21Z" fill="#FFFFFF" />
    <path
      d="M14 27h6l3-6 4 11 3-5h4"
      fill="none"
      stroke="#0E7C86"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
